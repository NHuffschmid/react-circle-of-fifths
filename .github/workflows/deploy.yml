name: Deploy Listener to GitHub Pages

on:
  push:
    paths:
      - 'listener/**'
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Checkout react-piano-keyboard
        uses: actions/checkout@v5
        with:
          repository: NHuffschmid/react-piano-keyboard
          path: react-piano-keyboard

      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install dependencies
        working-directory: listener
        run: |
          rm -f package-lock.json
          npm install

      - name: Build
        working-directory: listener
        env:
          REACT_PIANO_KEYBOARD_PATH: ../react-piano-keyboard/src
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: listener/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
